{% extends 'books/layout.html' %}
{% block content %}
    <h1>{{ book.title }}</h1>
    <p><strong>Author:</strong> {{ book.author }}</p>
    <p><strong>Year:</strong> {{ book.year }} | <strong>Rating:</strong> {{ book.rating }}</p>
    <p>{{ book.description }}</p>

    {% if user.is_authenticated and user == book.user %}
        <hr>
        <a class="button" href="{% url 'edit_book' book.pk %}">Edit</a> 
        <a class="button" href="{% url 'delete_book' book.pk %}">Delete</a>
    {% endif %}
{% endblock %}
