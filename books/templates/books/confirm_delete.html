{% extends 'books/layout.html' %}
{% block content %}
    <h2>Delete Book</h2>
    <p>Are you sure you want to delete "{{ object.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
        <a href="{% url 'book_detail' object.pk %}">Cancel</a>
    </form>
{% endblock %}
